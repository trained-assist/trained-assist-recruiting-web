# Proposed replacement for the old GCP upstream blocks inside the HTTPS
# recruiter-assistant.ru server. Do not include until the cutover gate passes.
location = /hh/proactive {
    proxy_pass http://127.0.0.1:18083;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log off;
}

location = /hh/proactive/app.js {
    proxy_pass http://127.0.0.1:18083;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log off;
}

location = /hh/proactive/history {
    proxy_pass http://127.0.0.1:18083;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log off;
}

location ^~ /api/hh/proactive/ {
    proxy_pass http://127.0.0.1:18083;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
    proxy_buffering off;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log off;
}
