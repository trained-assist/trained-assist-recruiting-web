# Proposed read-only R-01 routes. Include only after CP membership, client,
# private HH canary and public route cutover review; never enable from CI.
location = /hh/responses {
    proxy_pass http://127.0.0.1:18083;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log off;
}

location = /api/v1/ui/hh-responses {
    proxy_pass http://127.0.0.1:18083;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log off;
}

